<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Teamo La</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>
    body {
        margin: 0;
        font-family: 'Courier New', monospace;
        background: linear-gradient(135deg, #6d2fff, #dc2fff);
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        color: white;
        text-align: center;
        padding: 20px;
    }

    .card {
        background: rgba(0, 0, 0, 0.8);
        padding: 25px;
        border-radius: 20px;
        width: 90%;
        max-width: 400px;
        box-shadow: 0 10px 30px rgba(0,0,0,0.4);
        animation: fadeIn 1.5s ease-in-out;
    }

    h2 {
        display: none;
        margin-bottom: 15px;
    }

    /* Envelope icon with superscript heart */
    .envelope {
        font-size: 80px;
        margin: 20px 0;
        cursor: pointer;
        position: relative; /* needed for heart positioning */
        transition: transform 0.3s ease;
    }

    .envelope:hover {
        transform: scale(1.1);
    }

    /* Superscript pumping heart near upper-right corner */
    .envelope::after {
        content: "💖";
        position: absolute;
        top: -5px;    
        right: -5px;  
        font-size: 28px; 
        animation: heartbeat 1s infinite; /* normal heartbeat */
    }

    /* Faster heartbeat on hover */
    .envelope:hover::after {
        animation: heartbeat 0.5s infinite; /* faster when hovered */
    }

    @keyframes heartbeat {
        0%, 100% { transform: scale(1); }
        25% { transform: scale(1.2); }
        50% { transform: scale(1); }
        75% { transform: scale(1.2); }
    }

    .slideshow {
        display: none; /* hidden initially */
        width: 100%;
        margin-bottom: 15px;
        opacity: 0;
        transition: opacity 0.5s ease-in;
    }

    .slideshow.show {
        display: block;
        opacity: 1;
    }

    .slideshow img {
        width: 100%;
        height: auto;
        display: none;
        border-radius: 15px;
    }

    .slideshow img.first-slide {
        display: block; /* first slide shows immediately */
    }

    .output {
        margin-top: 15px;
        font-size: 18px;
        line-height: 1.6;
        min-height: 80px;
    }

    button {
        margin-top: 15px;
        padding: 10px 20px;
        border: none;
        border-radius: 20px;
        background: #6d2fff;
        color: white;
        font-weight: bold;
        cursor: pointer;
        transition: 0.3s;
    }

    button:hover {
        background: #6d2fff;
    }

    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(20px); }
        to { opacity: 1; transform: translateY(0); }
    }
</style>
</head>

<body>

<div class="card">

    <!-- Hidden title -->
    <h2 id="title">💖 Happiest Valentine’s Day!<br> La💘 ko 💖</h2>

    <!-- Envelope icon -->
    <div class="envelope" id="envelope">
        <i class="fas fa-envelope"></i>
    </div>

    <!-- Slideshow container -->
    <div class="slideshow" id="slideshow">
        <img src="Picture/1.jpeg" class="first-slide">
        <img src="Picture/2.jpg">
        <img src="Picture/3.jpg">
        <img src="Picture/4.jpeg">
        <img src="Picture/5.JPG">
        <img src="Picture/6.jpg">
        <img src="Picture/7.jpg">
        <img src="Picture/8.jpg">
        <img src="Picture/9.jpg">
        <img src="Picture/10.jpg">
        <img src="Picture/11.jpg">
        <img src="Picture/12.jpg">
        <img src="Picture/13.jpg">
        <img src="Picture/14.jpg">
        <img src="Picture/15.jpg">
        <img src="Picture/16.jpg">
        <img src="Picture/17.jpg">
        <img src="Picture/18.jpg">
        <img src="Picture/19.jpeg">
        <img src="Picture/20.jpeg">
        <img src="Picture/21.jpg">
        <img src="Picture/22.jpeg">
        <img src="Picture/23.jpg">
        <img src="Picture/24.jpg">
        <img src="Picture/25.jpg">
        <img src="Picture/26.jpg">
        <img src="Picture/27.jpg">
        <img src="Picture/28.jpg">
        <img src="Picture/29.jpg">
        <img src="Picture/30.jpg">
        <img src="Picture/31.jpeg">
        <img src="Picture/32.jpg">
        <img src="Picture/33.jpg">
    </div>

    <div class="output" id="output"></div>

    <button id="runBtn" onclick="runProgram()">❤️Open Me❤️</button>

</div>

<!-- Background music -->
<audio id="bgMusic" src="Picture/bgmusic.mp3" loop></audio>

<script>
let slideshowStarted = false;
let slides = document.querySelectorAll(".slideshow img");
let currentSlide = 0;

// Preload images to prevent blank frames
slides.forEach(img => {
    const pre = new Image();
    pre.src = img.src;
});

function runProgram() {

    // Hide button
    document.getElementById("runBtn").style.display = "none";

    // Show title
    document.getElementById("title").style.display = "block";

    // Hide envelope
    document.getElementById("envelope").style.display = "none";

    // Show slideshow container immediately
    const slideshow = document.getElementById("slideshow");
    slideshow.classList.add("show");

    // Ensure first image shows immediately
    slides.forEach((img, index) => {
        img.style.display = index === 0 ? "block" : "none";
    });
    currentSlide = 0;

    // Show message
    document.getElementById("output").innerHTML = `
        My heart is yours today, tomorrow, and forever.<br>
        Happy Valentine’s Day, La ko Muuuuuuuahhh! 💘.<br><br>
        ❤️❤️❤️❤️❤️❤️❤️❤️❤️❤️❤️❤️❤️❤️❤️❤️
    `;

    // Play music
    const music = document.getElementById("bgMusic");
    music.play().catch(() => {});

    // Start slideshow cycling only once
    if (!slideshowStarted) {
        slideshowStarted = true;

        setInterval(() => {
            slides[currentSlide].style.display = "none"; // hide current
            currentSlide = (currentSlide + 1) % slides.length;
            slides[currentSlide].style.display = "block"; // show next
        }, 1850);
    }
}
</script>

</body>
</html>
